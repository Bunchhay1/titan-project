# =============================================================================
# Titan Banking — Docker Compose (Local - Apple Silicon M1/M2/M3 compatible)
#
# Services:
#   postgres                    → 5432   (titandb + notificationdb)
#   redis                       → 6379
#   kafka (KRaft, no Zookeeper) → 9092
#   titan-core-banking          → 8080
#   titan-notifications-service → 8084
#
# Start:  docker compose up -d --build
# Stop:   docker compose down
# Logs:   docker compose logs -f titan-core-banking titan-notifications-service
# =============================================================================

services:

  # ── PostgreSQL (with PostGIS — required by titan-promotions-service V5 migration) ──
  postgres:
    build:
      context: ./init-db
      dockerfile: Dockerfile.postgres
    platform: linux/arm64
    container_name: titan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      POSTGRES_DB: titandb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql
      - ./init-db/02-notification-schema.sql:/docker-entrypoint-initdb.d/02-notification-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d titandb"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 15

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    platform: linux/arm64
    container_name: titan-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  # cp-kafka 7.6.0 supports arm64 natively
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/arm64
    container_name: titan-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 15

  # ── Kafka Topic Initializer (runs once then exits) ─────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/arm64
    container_name: titan-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.completed --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.accounts.created --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.accounts.updated --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.notifications.dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.atm.withdrawals --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.promotions.rewards --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.rewards.granted --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.rewards.acknowledgment --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.transactions.poison --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.loans.applied --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.loans.approved --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic banking.loans.rejected --partitions 3 --replication-factor 1
        echo "✅ Topics ready:"
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: "no"

  # ── Core Banking ───────────────────────────────────────────────────────────
  titan-core-banking:
    build:
      context: ./titan-core-banking
      dockerfile: Dockerfile
    platform: linux/arm64          # Apple Silicon (M1/M2/M3). Change to linux/amd64 on Intel/Render.
    container_name: titan-core-banking
    ports:
      - "8080:8080"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/titandb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: titandb
      DB_USERNAME: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"

      # ── Kafka ─────────────────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # ── Redis ─────────────────────────────────────────────────────────────
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Spring ────────────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      JAVA_OPTS: "-Xmx512m -Xms256m"

      # ── ATM Cardless Withdrawal ───────────────────────────────────────────
      # How many minutes a generated ATM code stays valid (default: 10).
      ATM_CODE_EXPIRY_MINUTES: "10"

      # ── gRPC AI service (optional) ────────────────────────────────────────
      # Override if titan-ai-service is running in the same compose network.
      AI_HOST: localhost
      AI_PORT: "50051"

      # ── Loan service URL ──────────────────────────────────────────────────
      LOANS_SERVICE_URL: http://titan-loans-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── API Gateway (Go) ──────────────────────────────────────────────────────
  # Single entry point for the iOS app.
  # iOS → localhost:8088 → titan-gateway-go → downstream services
  titan-gateway-go:
    build:
      context: ./titan-gateway-go
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: titan-gateway-go
    ports:
      - "8088:8088"
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./titan-gateway-go/config.yaml:/app/config.yaml:ro
    depends_on:
      titan-core-banking:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # ── Notifications Service ──────────────────────────────────────────────────
  titan-notifications-service:
    build:
      context: .
      dockerfile: titan-notifications-service/Dockerfile
    container_name: titan-notifications-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notificationdb
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notificationdb
      DB_USERNAME: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xmx384m -Xms192m"
      SPRING_CLOUD_VAULT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      titan-core-banking:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Loans Service ─────────────────────────────────────────────────────────
  titan-loans-service:
    build:
      context: ./titan-loans-service
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: titan-loans-service
    ports:
      - "8085:8085"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loansdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: loansdb
      DB_USERNAME: postgres
      DB_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"

      # ── Kafka ─────────────────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # ── Redis ─────────────────────────────────────────────────────────────
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── JWT secret (shared with core-banking) ─────────────────────────────
      JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"

      # ── Core Banking URL (for cross-service calls) ────────────────────────
      CORE_BANKING_URL: http://titan-core-banking:8080

      # ── Spring ────────────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      JAVA_OPTS: "-Xmx384m -Xms192m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      titan-core-banking:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  # ── Promotions Service ─────────────────────────────────────────────────────
  titan-promotions-service:
    build:
      context: ./titan-promotions-service
      dockerfile: Dockerfile
    platform: linux/arm64          # Apple Silicon (M1/M2/M3). Change to linux/amd64 on Intel.
    container_name: titan-promotions-service
    ports:
      - "8083:8083"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DATABASE_URL: jdbc:postgresql://postgres:5432/promotiondb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotiondb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "TitanDB$$ecure2026_X9z!Lp"

      # ── Kafka ─────────────────────────────────────────────────────────────
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # ── Redis ─────────────────────────────────────────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # ── Neo4j (disabled — not in local compose stack) ─────────────────────
      # Service will fall back gracefully; Neo4j-dependent features skip.
      SPRING_NEO4J_URI: bolt://localhost:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password

      # ── Downstream services ───────────────────────────────────────────────
      CORE_BANKING_GRPC_HOST: titan-core-banking
      CORE_BANKING_GRPC_PORT: 9090
      AI_SERVICE_HOST: localhost
      AI_SERVICE_PORT: 50051
      AI_SERVICE_URL: http://localhost:8085

      # ── Spring ────────────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_VAULT_ENABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
      JAVA_OPTS: "-Xmx512m -Xms256m"

      # ── Flyway ────────────────────────────────────────────────────────────
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      titan-core-banking:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 150s
      retries: 5

volumes:
  postgres_data:

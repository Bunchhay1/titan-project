# ==========================================
# TITAN LOANS SERVICE — LOCAL ENVIRONMENT
# ==========================================

spring.application.name=titan-loans-service
server.port=8085

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loansdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:TitanDB$ecure2026_X9z!Lp}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT (shared secret with titan-core-banking) ──────────────────────────────
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

# ── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

# ── Redis (idempotency cache) ─────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Actuator / Observability ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=0.0
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.titan.loans=INFO
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# ── Core Banking service URL (for cross-service account validation) ───────────
titan.core-banking.url=${CORE_BANKING_URL:http://titan-core-banking:8080}
